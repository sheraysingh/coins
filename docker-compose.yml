services:
  apex:
    build: .
    container_name: apex-system
    ports:
      - "5050:5050"
    volumes:
      - ./.env:/apex-system/.env:ro
      - ./logs:/apex-system/logs
      - ./portfolio/reports:/apex-system/portfolio/reports
    restart: unless-stopped
    environment:
      - TZ=America/Toronto
