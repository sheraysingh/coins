services:
  apex-dashboard:
    build: .
    container_name: apex-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /docker/openclaw-wekw/data/apex-dashboard:/app/data:ro
    environment:
      - COINGECKO_API_KEY=${COINGECKO_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
