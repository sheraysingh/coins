<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="60">
    <title>APEX Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0a0f; color: #e0e0e0; }
        .header { background: #111; padding: 20px 30px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.5rem; color: #fff; }
        .mode { padding: 4px 12px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
        .mode-PAPER { background: #2d2006; color: #f0b429; border: 1px solid #f0b429; }
        .mode-LIVE { background: #0a2e1a; color: #34d399; border: 1px solid #34d399; }
        .container { padding: 30px; max-width: 1200px; margin: 0 auto; }
        .card { background: #151520; border: 1px solid #222; border-radius: 8px; padding: 24px; margin-bottom: 20px; }
        .card h2 { font-size: 1.1rem; color: #888; margin-bottom: 12px; }
        .status { font-size: 1.2rem; color: #34d399; }
    </style>
</head>
<body>
    <div class="header">
        <h1>APEX Command Center</h1>
        <span class="mode mode-{{ mode }}">{{ mode }} MODE</span>
    </div>
    <div class="container">
        <div class="card">
            <h2>System Status</h2>
            <p class="status">Online — All systems operational</p>
        </div>
        <div class="card">
            <h2>Trading Signals</h2>
            <p>Phase 1 dashboard — signals module coming soon.</p>
        </div>
        <div class="card">
            <h2>Real Estate Deals</h2>
            <p>Phase 1 dashboard — RE scraper coming soon.</p>
        </div>
    </div>
</body>
</html>
